name = "ksecrets-api"
main = "apps/api/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "ksecrets-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ksecrets-files"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]
