name = "pwpush-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "pwpush-db"
database_id = "your-database-id"

[[r2_buckets]]
binding = "FILES"
bucket_name = "pwpush-files"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "your-kv-namespace-id"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]